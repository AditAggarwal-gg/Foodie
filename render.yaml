services:
  - type: web
    name: foodie-voice-order
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
